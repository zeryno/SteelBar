<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Bar Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap">
    <style>
        :root {
            --bg:           #FAFAF7;
            --surface:      #FFFFFF;
            --surface-soft: #F5F5F1;
            --bg-input:     #F5F5F1;

            --text-1: #18181B;
            --text-2: #52525B;
            --text-3: #A1A1AA;
            --text-4: #D4D4D7;

            --border:    #ECECE6;
            --border-hi: #D8D8D2;

            --accent:        #18181B;
            --accent-hover:  #27272A;
            --accent-soft:   rgba(24, 24, 27, 0.08);

            --success:    #15803D;
            --success-bg: #F0FDF4;

            --dot-blue:   #3B82F6;
            --dot-green:  #10B981;
            --dot-amber:  #F59E0B;
            --dot-orange: #F97316;
            --dot-pink:   #EC4899;
            --dot-purple: #8B5CF6;
            --dot-red:    #EF4444;

            --shadow-card: 0 1px 3px rgba(15, 15, 15, 0.04), 0 8px 24px rgba(15, 15, 15, 0.04);

            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 14px;

            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            --font-hand: 'Caveat', cursive;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            background-image: radial-gradient(circle, rgba(24, 24, 27, 0.05) 0.6px, transparent 0.7px);
            background-size: 24px 24px;
            color: var(--text-1);
            font-size: 14px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 64px;
            position: relative;
            z-index: 1;
        }

        /* ==================== Top brand bar ==================== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 0 22px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 64px;
        }
        .brand-name {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.005em;
            color: var(--text-1);
        }
        .credit {
            font-family: var(--font-hand);
            font-size: 26px;
            font-weight: 600;
            color: #6B7280;
            line-height: 1;
            transform: translateY(2px) rotate(-3deg);
        }

        /* ==================== Title row ==================== */
        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 36px;
            position: relative;
        }
        .title-block {
            position: relative;
            display: inline-block;
        }
        .title-main {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -0.035em;
            color: var(--text-1);
            line-height: 1.05;
            margin: 0;
            position: relative;
            z-index: 1;
            display: inline-block;
        }
        .title-underline {
            position: absolute;
            left: -8px;
            right: -8px;
            bottom: -10px;
            width: calc(100% + 16px);
            height: 26px;
            z-index: 0;
            pointer-events: none;
        }

        .segmented {
            display: inline-flex;
            background: var(--surface-soft);
            border-radius: 999px;
            padding: 3px;
            flex-shrink: 0;
        }
        .segmented input { display: none; }
        .segmented label {
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            cursor: pointer;
            border-radius: 999px;
            transition: color 0.15s ease, background 0.15s ease;
            user-select: none;
        }
        .segmented label:hover { color: var(--text-1); }
        .segmented input:checked + label {
            background: var(--accent);
            color: #fff;
        }

        /* ==================== Main grid ==================== */
        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 24px;
            align-items: stretch;
        }

        /* ==================== Cards ==================== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-card);
        }

        /* ==================== Table ==================== */
        .table-card { padding: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .table-wrap { overflow-x: auto; flex: 1; }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead th {
            text-align: left;
            padding: 16px 16px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-2);
            white-space: nowrap;
            vertical-align: top;
        }
        thead th:last-child { text-align: right; }
        thead th .u {
            display: block;
            margin-top: 5px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 400;
            color: var(--text-3);
            letter-spacing: 0.04em;
        }

        tbody td {
            padding: 11px 16px;
            color: var(--text-1);
            vertical-align: middle;
            border-top: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        tbody td:last-child { text-align: right; }

        .dia-chip {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-1);
        }
        .dia-chip .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-blue   { background: var(--dot-blue); }
        .dot-green  { background: var(--dot-green); }
        .dot-amber  { background: var(--dot-amber); }
        .dot-orange { background: var(--dot-orange); }
        .dot-pink   { background: var(--dot-pink); }
        .dot-purple { background: var(--dot-purple); }
        .dot-red    { background: var(--dot-red); }

        .col-unit { color: var(--text-2); }

        .num-input {
            width: 100%;
            max-width: 140px;
            padding: 8px 12px;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            background: var(--bg-input);
            color: var(--text-1);
            font-family: var(--font-mono);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            text-align: right;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .num-input::placeholder { color: var(--text-4); font-weight: 400; }
        .num-input:hover { background: #EEEEE7; }
        .num-input:focus {
            outline: none;
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .num-input::-webkit-outer-spin-button,
        .num-input::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
        .num-input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

        .result {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
            font-variant-numeric: tabular-nums;
        }
        .result.dim { color: var(--text-4); font-weight: 400; }

        /* ==================== Summary ==================== */
        .summary {
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--success-bg);
            color: var(--success);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            align-self: flex-start;
        }
        .status-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .hero { margin: 22px 0 4px; }
        .hero-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-3);
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .hero-label .mode-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-2);
            letter-spacing: 0.08em;
            font-weight: 600;
            padding: 2px 7px;
            background: var(--surface-soft);
            border-radius: 4px;
        }
        .hero-value {
            font-family: var(--font-mono);
            font-size: 50px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.045em;
            color: var(--text-1);
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hero-value .unit {
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 500;
            color: var(--text-3);
            letter-spacing: 0.02em;
        }

        .summary-divider {
            height: 1px;
            background: var(--border);
            margin: 22px 0 4px;
        }

        .metric {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }
        .metric:last-of-type { border-bottom: none; }
        .metric-key {
            color: var(--text-2);
            font-weight: 500;
        }
        .metric-val {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-1);
            font-variant-numeric: tabular-nums;
        }
        .metric-val .unit-s {
            font-family: var(--font-sans);
            font-size: 11px;
            color: var(--text-3);
            font-weight: 500;
            margin-left: 4px;
            letter-spacing: 0;
        }

        body[data-mode="weight"] .metric-weight { display: none; }
        body[data-mode="pieces"] .metric-pieces { display: none; }

        .summary-spacer { flex: 1; min-height: 16px; }

        .summary-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: 20px;
        }
        .btn {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-hi);
            background: var(--surface);
            color: var(--text-1);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.06s ease;
        }
        .btn:hover { background: var(--surface-soft); border-color: var(--text-3); }
        .btn:active { transform: translateY(1px); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .privacy {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-3);
        }
        .privacy svg { width: 11px; height: 11px; flex-shrink: 0; opacity: 0.7; }

        /* ==================== Animations ==================== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes drawUnderline {
            from { stroke-dashoffset: 700; }
            to   { stroke-dashoffset: 0; }
        }
        .topbar     { animation: fadeUp 0.4s ease 0.00s both; }
        .title-row  { animation: fadeUp 0.4s ease 0.06s both; }
        .table-card { animation: fadeUp 0.4s ease 0.12s both; }
        .summary    { animation: fadeUp 0.4s ease 0.18s both; }

        .title-underline path {
            stroke-dasharray: 700;
            stroke-dashoffset: 700;
            animation: drawUnderline 1.1s ease-out 0.5s forwards;
        }

        /* ==================== Responsive ==================== */
        @media (max-width: 1024px) {
            .grid { grid-template-columns: 1fr; align-items: start; }
            .summary { display: block; }
            .summary-spacer { display: none; }
        }
        @media (max-width: 720px) {
            .page { padding: 0 18px 48px; }
            .topbar { margin-bottom: 36px; padding: 18px 0 14px; }
            .title-row { flex-direction: column; align-items: stretch; gap: 16px; }
            .title-main { font-size: 32px; }
            .hero-value { font-size: 40px; }
            table { table-layout: auto; }
            thead th, tbody td { padding: 10px 8px; font-size: 12px; }
            thead th .u { font-size: 10px; }
            .num-input { padding: 7px 8px; font-size: 12px; max-width: 90px; }
        }
    </style>
</head>
<body data-mode="weight">

    <div class="page">

        <header class="topbar">
            <span class="brand-name">Steel Bar Calculator</span>
            <span class="credit">by Hanry</span>
        </header>

        <section class="title-row">
            <div class="title-block">
                <h1 class="title-main">钢筋计算器</h1>
                <svg class="title-underline" viewBox="0 0 280 28" preserveAspectRatio="none" fill="none">
                    <path d="M 8 16 C 50 8 110 13 160 16 C 210 19 240 22 272 12"
                          stroke="#FCD34D" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
                    <path d="M 14 19 C 70 13 130 17 200 19 C 240 20 252 18 268 16"
                          stroke="#F59E0B" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
                </svg>
            </div>
            <div class="segmented" role="tablist" aria-label="计算模式">
                <input type="radio" id="mode-weight" name="mode" value="weight" checked>
                <label for="mode-weight">计算重量</label>
                <input type="radio" id="mode-pieces" name="mode" value="pieces">
                <label for="mode-pieces">计算根数</label>
            </div>
        </section>

        <div class="grid">

            <section class="card table-card">
                <div class="table-wrap">
                    <table id="rebarTable">
                        <colgroup>
                            <col style="width: 14%">
                            <col style="width: 14%">
                            <col style="width: 17%">
                            <col style="width: 19%">
                            <col style="width: 18%">
                            <col style="width: 18%">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>直径<span class="u">mm</span></th>
                                <th>每米重量<span class="u">kg / m</span></th>
                                <th>捆数<span class="u">× 2 t</span></th>
                                <th class="dynamic-header">根数<span class="u">pcs</span></th>
                                <th>长度<span class="u">m</span></th>
                                <th class="result-header">重量<span class="u">t</span></th>
                            </tr>
                        </thead>
                        <tbody id="rebarBody"></tbody>
                    </table>
                </div>
            </section>

            <aside class="card summary">
                <div class="status-pill">
                    <span class="dot"></span>
                    实时计算
                </div>

                <div class="hero">
                    <div class="hero-label">
                        <span id="heroLabel">总重量</span>
                        <span class="mode-tag" id="modeTag">WEIGHT</span>
                    </div>
                    <div class="hero-value">
                        <span id="heroValue">0.000</span><span class="unit" id="heroUnit">t</span>
                    </div>
                </div>

                <div class="summary-divider"></div>

                <div class="metric metric-weight">
                    <span class="metric-key">总重量</span>
                    <span class="metric-val" id="metricWeight">0.000<span class="unit-s">吨</span></span>
                </div>
                <div class="metric metric-pieces">
                    <span class="metric-key">总根数</span>
                    <span class="metric-val" id="metricPieces">0<span class="unit-s">根</span></span>
                </div>
                <div class="metric">
                    <span class="metric-key">总长度</span>
                    <span class="metric-val" id="metricLength">0<span class="unit-s">米</span></span>
                </div>
                <div class="metric">
                    <span class="metric-key">总捆数</span>
                    <span class="metric-val" id="metricBundles">0<span class="unit-s">捆</span></span>
                </div>

                <div class="summary-spacer"></div>

                <div class="summary-actions">
                    <button type="button" class="btn btn-primary" id="calcBtn">立即计算</button>
                    <button type="button" class="btn" id="resetBtn">清空</button>
                </div>

                <div class="privacy">
                    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        <rect x="2.5" y="5.5" width="7" height="5" rx="0.8"/>
                        <path d="M 4 5.5 L 4 4 Q 4 2 6 2 Q 8 2 8 4 L 8 5.5"/>
                    </svg>
                    数据仅在本地计算，不会保存任何记录
                </div>
            </aside>

        </div>
    </div>

    <script>
        const REBAR_SPECS = [
            { diameter: 8,  unitWeight: 0.395, color: 'blue'   },
            { diameter: 10, unitWeight: 0.617, color: 'green'  },
            { diameter: 12, unitWeight: 0.888, color: 'amber'  },
            { diameter: 16, unitWeight: 1.578, color: 'orange' },
            { diameter: 20, unitWeight: 2.467, color: 'pink'   },
            { diameter: 25, unitWeight: 3.853, color: 'purple' },
            { diameter: 32, unitWeight: 6.313, color: 'red'    },
        ];

        const BUNDLE_TONS = 2;
        const DEFAULT_LENGTH = 12;

        const $ = id => document.getElementById(id);
        const tbody          = $('rebarBody');
        const heroLabelEl    = $('heroLabel');
        const heroValueEl    = $('heroValue');
        const heroUnitEl     = $('heroUnit');
        const modeTagEl      = $('modeTag');
        const metricWeightEl = $('metricWeight');
        const metricPiecesEl = $('metricPieces');
        const metricLengthEl = $('metricLength');
        const metricBundlesEl= $('metricBundles');
        const dynamicHeader  = document.querySelector('.dynamic-header');
        const resultHeader   = document.querySelector('.result-header');

        const fmt = {
            weight: n => n.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 }),
            length: n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            int:    n => n.toLocaleString('en-US'),
        };

        function buildRows() {
            tbody.innerHTML = REBAR_SPECS.map(spec => `
                <tr data-diameter="${spec.diameter}" data-unit-weight="${spec.unitWeight}" data-color="${spec.color}">
                    <td>
                        <span class="dia-chip">
                            <span class="dot dot-${spec.color}"></span>${spec.diameter} mm
                        </span>
                    </td>
                    <td class="col-unit">${spec.unitWeight.toFixed(3)}</td>
                    <td><input type="number" min="0" placeholder="0" class="num-input bundle-input"></td>
                    <td><input type="number" min="0" step="1" placeholder="0" class="num-input variable-input"></td>
                    <td><input type="number" min="0" step="0.1" placeholder="${DEFAULT_LENGTH}" class="num-input length-input"></td>
                    <td><span class="result dim">—</span></td>
                </tr>
            `).join('');
        }

        function getMode() {
            return document.querySelector('input[name="mode"]:checked').value;
        }

        function applyMode() {
            const mode = getMode();
            document.body.dataset.mode = mode;

            if (mode === 'weight') {
                dynamicHeader.innerHTML = '根数<span class="u">pcs</span>';
                resultHeader.innerHTML  = '重量<span class="u">t</span>';
                heroLabelEl.textContent = '总重量';
                heroUnitEl.textContent  = 't';
                modeTagEl.textContent   = 'WEIGHT';
                tbody.querySelectorAll('.variable-input').forEach(input => {
                    input.placeholder = '0';
                    input.step = '1';
                    input.value = '';
                });
            } else {
                dynamicHeader.innerHTML = '重量<span class="u">t</span>';
                resultHeader.innerHTML  = '根数<span class="u">pcs</span>';
                heroLabelEl.textContent = '总根数';
                heroUnitEl.textContent  = 'pcs';
                modeTagEl.textContent   = 'PIECES';
                tbody.querySelectorAll('.variable-input').forEach(input => {
                    input.placeholder = '0.000';
                    input.step = '0.001';
                    input.value = '';
                });
            }
            calculate();
        }

        function readRow(row) {
            const bv = row.querySelector('.bundle-input').value;
            const vv = row.querySelector('.variable-input').value;
            const lv = row.querySelector('.length-input').value;
            return {
                diameter:    parseFloat(row.dataset.diameter),
                unitWeight:  parseFloat(row.dataset.unitWeight),
                bundles:     bv === '' ? 0 : (parseInt(bv) || 0),
                variable:    vv === '' ? 0 : (parseFloat(vv) || 0),
                length:      lv === '' ? DEFAULT_LENGTH : (parseFloat(lv) || DEFAULT_LENGTH),
                hasVariable: vv !== '' && parseFloat(vv) > 0,
                resultEl:    row.querySelector('.result'),
            };
        }

        function setResult(el, value, dim) {
            el.textContent = value;
            el.classList.toggle('dim', !!dim);
        }

        function calculate() {
            const mode = getMode();
            const rows = tbody.querySelectorAll('tr');
            let totalWeight  = 0;
            let totalLength  = 0;
            let totalPieces  = 0;
            let totalBundles = 0;

            rows.forEach(row => {
                const r = readRow(row);
                const bundleWeight = r.bundles * BUNDLE_TONS;
                totalBundles += r.bundles;

                if (mode === 'weight') {
                    const pieces = Math.floor(r.variable);
                    const pieceWeight = (pieces * r.unitWeight * r.length) / 1000;
                    const rowWeight = bundleWeight + pieceWeight;
                    setResult(r.resultEl, rowWeight > 0 ? fmt.weight(rowWeight) : '—', rowWeight === 0);
                    totalWeight += rowWeight;
                    totalPieces += pieces;
                    totalLength += pieces * r.length;
                } else {
                    // Pieces mode — bundles AND target weight both convert to pieces
                    const targetWeight = r.variable;
                    const totalRowWeight = bundleWeight + targetWeight;
                    let pieces = 0;
                    if (totalRowWeight > 0) {
                        pieces = Math.round((totalRowWeight * 1000) / (r.unitWeight * r.length));
                        setResult(r.resultEl, fmt.int(pieces), false);
                    } else {
                        setResult(r.resultEl, '—', true);
                    }
                    totalWeight += totalRowWeight;
                    totalPieces += pieces;
                    totalLength += pieces * r.length;
                }
            });

            if (mode === 'weight') {
                heroValueEl.textContent = fmt.weight(totalWeight);
            } else {
                heroValueEl.textContent = fmt.int(totalPieces);
            }

            metricWeightEl.innerHTML  = `${fmt.weight(totalWeight)}<span class="unit-s">吨</span>`;
            metricPiecesEl.innerHTML  = `${fmt.int(totalPieces)}<span class="unit-s">根</span>`;
            metricLengthEl.innerHTML  = `${fmt.length(totalLength)}<span class="unit-s">米</span>`;
            metricBundlesEl.innerHTML = `${fmt.int(totalBundles)}<span class="unit-s">捆</span>`;
        }

        function resetAll() {
            tbody.querySelectorAll('input').forEach(i => i.value = '');
            calculate();
        }

        tbody.addEventListener('input', calculate);
        document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', applyMode));
        $('calcBtn').addEventListener('click', calculate);
        $('resetBtn').addEventListener('click', resetAll);

        buildRows();
        applyMode();
    </script>
</body>
</html>
